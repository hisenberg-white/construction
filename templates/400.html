<!doctype html>
{# Self-contained like 500.html: a bad request may not have a usable context. #}
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bad request — DepotLedger</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:#f1f5f9; color:#1e293b; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding:16px; box-sizing:border-box; }
    .box { background:#fff; border:1px solid #e7ecf3; border-radius:12px; box-shadow:0 1px 3px rgba(15,23,42,.06);
      max-width:440px; width:100%; padding:32px 24px; text-align:center; }
    .code { font-size:3.5rem; font-weight:700; color:#2563eb; letter-spacing:-.04em; line-height:1; margin-bottom:12px; }
    h1 { font-size:1.35rem; margin:0 0 8px; color:#0f172a; }
    p { color:#64748b; margin:0 0 24px; line-height:1.5; }
    a { display:inline-block; background:#2563eb; color:#fff; text-decoration:none; padding:.55rem 1.1rem; border-radius:8px; font-weight:500; }
  </style>
</head>
<body>
  <div class="box">
    <div class="code">400</div>
    <h1>Bad request</h1>
